[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puz-grabber"
version = "0.1.0"
description = "Puzzle downloader utility"
readme = "README.md"
requires-python = ">=3.10"

dependencies = ["requests", "beautifulsoup4"]

# Optional: entry point for CLI (runs __main__.py when installed)
[project.scripts]
puz-grabber = "puz_grabber.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]
